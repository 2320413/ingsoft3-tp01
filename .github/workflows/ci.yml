name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend/LosSantosAutoMarket.Api
          target: test
          load: true
          push: false
          tags: los-santos-backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con coverage
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/TestResults:/out" \
            los-santos-backend-test:ci \
            --collect:"XPlat Code Coverage"

      - name: Reporte de coverage del backend
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/*/coverage.cobertura.xml" \
            -sourcedirs:backend/LosSantosAutoMarket.Api \
            -targetdir:coveragereport \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-classfilters:-Program*;-LosSantosAutoMarket.Api.Data.*;-LosSantosAutoMarket.Api.Models.*;-LosSantosAutoMarket.Api.Migrations.*"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del backend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend/LosSantosAutoMarket.Api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: los-santos-frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con coverage
        run: |
          docker run --rm \
            -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" \
            los-santos-frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) {
              console.error('Se midieron 0 archivos: revisar coverage.include');
              process.exit(1);
            }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| metrica | % |');
            console.log('|---|---|');
            console.log(f('lines'));
            console.log(f('branches'));
            console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    permissions: {}

    steps:
      - name: Desplegar en QA la imagen del commit
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"

          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test de QA
        shell: bash
        env:
          URL_API: https://los-santos-api-qa.onrender.com
          URL_FRONT: https://los-santos-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."

          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
                && curl -fsS --max-time 10 "$URL_API/api/vehiculos" > /dev/null \
                && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "QA responde correctamente: API + BD + frontend"
              exit 0
            fi

            echo "Intento $i/30 fallido. Reintentando en 20 segundos..."
            sleep 20
          done

          echo "QA no respondió a tiempo"
          exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    permissions:
      contents: read

    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Esperar a que la API nueva este desplegada en QA
        shell: bash
        env:
          API_BASE_URL: https://los-santos-api-qa.onrender.com
        run: |
          READY=false

          for i in $(seq 1 30); do
            if CODE=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"nombre":""}' \
              "$API_BASE_URL/api/vehiculos"); then

              if [ "$CODE" = "400" ]; then
                echo "La API nueva de QA esta lista"
                READY=true
                break
              fi
            else
              CODE="000"
            fi

            echo "Intento $i/30: HTTP $CODE"
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "La API nueva de QA no estuvo lista a tiempo"
            exit 1
          fi

      - name: Tests de integracion contra QA
        working-directory: frontend
        env:
          API_BASE_URL: https://los-santos-api-qa.onrender.com
        run: npx playwright test e2e/api.spec.js

      - name: Publicar reporte de integracion
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    permissions:
      contents: read

    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Tests E2E contra QA
        working-directory: frontend
        env:
          E2E_BASE_URL: https://los-santos-front-qa.onrender.com
        run: npx playwright test e2e/vehiculos.spec.js

      - name: Publicar reporte E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    environment: production
    permissions: {}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Desplegar en PROD la imagen aprobada
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"

          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test de PROD
        shell: bash
        env:
          URL_API: https://los-santos-api-prod.onrender.com
          URL_FRONT: https://los-santos-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD esté vivo..."

          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
                && curl -fsS --max-time 10 "$URL_API/api/vehiculos" > /dev/null \
                && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "PROD responde correctamente: API + BD + frontend"
              exit 0
            fi

            echo "Intento $i/30 fallido. Reintentando en 20 segundos..."
            sleep 20
          done

          echo "PROD no respondió a tiempo"
          exit 1
